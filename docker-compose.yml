services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto
      POSTGRES_DB: ponto
    command: ["postgres", "-c", "max_connections=200", "-c", "synchronous_commit=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponto"]
      interval: 2s
      timeout: 3s
      retries: 30
    # limites fixos tornam os resultados comparáveis entre máquinas
    cpus: 2
    mem_limit: 1g

  api:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ponto:ponto@db:5432/ponto
      MODO: lote
      TAMANHO_LOTE: 200
      ESPERA_MS: 100
      TENTATIVAS: 8
      FILA_CAPACIDADE: 10000
      CONSUMIDORES: 1
      POOL_MAX: 20
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 1
    mem_limit: 1g

  # gerador de carga: contêiner separado para não disputar CPU com a API
  carga:
    build: .
    profiles: ["ferramentas"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://ponto:ponto@db:5432/ponto
    volumes:
      - ./resultados:/app/resultados
      - ./figuras:/app/figuras
      - ./dados:/app/dados
    cpus: 2
    entrypoint: ["python", "-m"]
    command: ["ponto.carga.experimento", "--suite", "padrao"]

  # servidor nulo para calibrar o gerador de carga (ponto.carga.calibrar)
  eco:
    build: .
    profiles: ["ferramentas"]
    entrypoint: ["python", "-m"]
    command: ["ponto.carga.calibrar", "--servir"]
    cpus: 1
