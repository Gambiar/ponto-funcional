[project]
name = "ponto-funcional"
version = "0.1.0"
description = "Pipeline funcional para registro de ponto sob alta concorrência"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "aiohttp>=3.9",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
teste = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
